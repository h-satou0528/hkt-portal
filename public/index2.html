  <style>



 body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #006400;
      color: white;
      padding: 1em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 1000;
    }

    header .logo {
      display: flex;
      align-items: center;
    }

    header .logo img {
      height: 60px;
      margin-right: 10px;
    }

    header nav button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-left: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    main {
      display: flex;
      margin-top: 60px; /* headerの高さ分 */
      height: calc(100vh - 60px);
    }

    .left-panel {
      width: 10%;
      background-color: #f0f0f0;
      border-right: 1px solid #ccc;
      padding: 1em;
      box-sizing: border-box;
    }

    .right-panel {
      flex-grow: 1;
      padding: 1em;
      box-sizing: border-box;
      /*試験で止めています。
      overflow-y: auto; */

    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }


/*左メニューlink_button*/
.link_button {
  font-weight: bold;/*太字に*/
  text-decoration: none;/*下線消す*/
  background: blue;/*背景を水色に*/
  color:white;/*文字を白に*/
  padding:5px 10px;/*内側の余白*/
  border-radius: 20px;/*角を丸くする*/
  font-family: 'Avenir','Arial';/*フォントをいい感じに*/
}
/*以下カーソルを当てたとき*/
.link_button:hover {
  background: silver;/*背景色をシルバーに*/
  text-decoration: none;/*下線を消す*/
}

/*以下訪問済みのデザイン*/
.link_button:visited {
  color: gray;/*文字をグレイに*/
}
    

</style>
