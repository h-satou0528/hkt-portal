<!-- 登録モーダル5/1テスト -->
<div id="registerModal" class="modal">
  <div class="modal-content" style="padding: 1em; border: 1px solid #ccc; background: #fff;">
    <!-- <span class="close" onclick="closeRegisterModal()">&times;</span> -->

    <div class="inputBox">
      <p><strong>工事件名を入力</strong></p>
      <input type="text" id="title" placeholder="件名"><br>

      <p><strong>担当者を入力</strong></p>
      <input type="text" id="person" placeholder="担当者"><br>

      <p><strong>摘要（工期など）を入力</strong></p>
      <textarea id="note" placeholder="摘要" rows="4"></textarea><br>

      <p id="saveMessage" style="color: green; display: none;">保存しました。</p>

      <div class="button-row">
      <button class="saveEntryBtn">保存</button>
      <button class="outModalBtn">閉じる</button>
      <button class="loadEntriesBtn" hidden>読み込み</button>
      </div>

      <p id="message"></p>
    </div>
  </div>
</div>

<!-- 枝番号登録モーダル　5/2追加 -->
<div id="branchModal" class="modal" style="display: none;">
  <div class="modal-content" style="padding: 1em; border: 1px solid #ccc; background: #fff;">
    <h3>枝番号登録</h3>

    <div>
      <p><strong>元工事番号を入力</strong></p>
      <label><input type="text" id="baseBandaiInput" class="modal-input" placeholder="例: 07-2003"></label>
    </div>
    <div>
      <p><strong>工事件名を入力</strong></p>
      <label><input type="text" id="branchTitle" class="modal-input"></label>
    </div>
    <div>
      <p><strong>担当者を入力</strong></p>
      <label><input type="text" id="branchPerson" class="modal-input"></label>
    </div>
    <div>
      <p><strong>摘要（工期など）を入力</strong></p>
      <label><input type="text" id="branchNote" class="modal-input"></label>
    </div>
    <!---
    削除厳禁(他のオブジェクトで使用)
    <button class="saveBranchEntry()">保存</button>
    <button class="closeBranchModal()">閉じる</button>
    削除厳禁
    -->
    <button class="branch-save-btn">保存</button>
    <button class="branch-close-btn">閉じる</button>
  </div>
</div>

  <div class="statusBox">

      <option value="">選択してください</option>
      <option value="〇">〇</option>
      <option value="△">△</option>
    </select><br>
  
    <p>請求書を選択</p>
    <select id="invoice">
      <option value="">選択してください</option>
      <option value="〇">〇</option>
      <option value="△">△</option>
    </select><br>
  
    <p>実績表を選択</p>
    <select id="performance">
      <option value="">選択してください</option>

      <option value="△">△</option>
    </select><br>

  </div>





    <div id="result">
      <div class="resultBox">
        <div class="search">
          <p><strong>工事番号または件名の文字で検索</strong></p>
          <input type="text" id="searchBandai" placeholder="例: 2051　または 文字"><button onclick="searchEntry()">検　索</button>
        </div>
      <h2>登録一覧</h2>
       <table>
          <thead>
            <tr>
              <th>工事番号</th>
              <th>工事件名</th>
              <th>担当者</th>
              <th>摘　要</th>
              <th>工事命令書</th>
              <th>請求書</th>
              <th>実績表</th>
            </tr>
          </thead>
            <tbody id="entryList"></tbody>
        </table>
      </div>
    </div>



<!-- 編集モーダル -->
<div id="editModal">
  <h3>編　集</h3>
  <label>工事番号: <input type="text" id="editBandai"></label>
  <label>件　名: <input type="text" id="editTitle"></label>
  <label>担当者: <input type="text" id="editPerson"></label>
  <label>摘　要: <textarea id="editNote" rows="3"></textarea></label>
  <label>工事命令書:
    <select id="editOrder">
      <option value="">選択</option>
      <option value="〇">〇</option>
      <option value="△">△</option>
    </select>
  </label>
  <label>請求書:
    <select id="editInvoice">
      <option value="">選択</option>
      <option value="〇">〇</option>
      <option value="△">△</option>
    </select>
  </label>
  <label>実績表:
    <select id="editPerformance">
      <option value="">選択</option>
      <option value="〇">〇</option>
      <option value="△">△</option>
    </select>
  </label>
  <button onclick="saveEdit()">保存</button>
  <button onclick="closeModal()">閉じる</button>
  <button onclick="markCurrentEditingRowAsMissing()">欠番にする</button>
</div>
